<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preview — GAMATEX Completion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
<header class="topbar">
  <a class="brand" href="index.html"><span class="brand-mark">G</span><span><strong>Recruitment Test</strong><small>PT. Gamatex</small></span></a>
  <div class="header-status">Preview halaman selesai</div>
</header>
<main id="app"></main>
<footer>Recruitment Test Gamatex · HRGA</footer>
</div>
<script>
const app=document.querySelector('#app');
function layout(content){
  app.innerHTML='<section class="card page-card completion-card">'+content+'</section>';
  app.classList.remove('glitch-enter'); void app.offsetWidth; app.classList.add('glitch-enter');
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const typeInto=async(el,text,speed=28)=>{
  el.textContent='';
  const c=document.createElement('span'); c.className='typing-cursor'; el.appendChild(c);
  for(const ch of text){c.before(document.createTextNode(ch));await wait(ch==='.'?speed*5:ch===','?speed*2:speed);}
  c.remove();
};
layout(`<div class="completion-screen">
<div class="completion-corner tl">PEOPLE<br>DENIM<br>PROGRESS</div>
<div class="completion-corner br">A STRONGER<br>TOMORROW<br>TOGETHER</div>
<section class="completion-tab">
<div class="completion-head"><span><i style="display:inline-block;width:9px;height:9px;background:var(--denim);margin-right:8px"></i>RECRUITMENT</span><span class="completion-count">SELESAI</span></div>
<span id="completionKicker" class="completion-kicker">06 / 06 · FINAL</span>
<div id="completionTitle" class="completion-title">TERIMA KASIH</div>
<div class="completion-copy"><span id="typingLine1" class="typing-line"></span><span id="typingLine2" class="typing-line"></span><span id="typingLine3" class="typing-line"></span></div>
<div class="completion-divider"></div><div id="completionFooter" class="completion-footer-text"></div>
<div id="completionLogo" class="completion-logo"><span class="logo-line">The Reliable</span><span class="logo-line logo-company">Denim Company</span><span class="logo-gamatex">GAMATEX</span></div>
<div class="actions" style="justify-content:center;margin-top:20px"><button class="btn btn-secondary" onclick="location.reload()">Ulangi animasi</button></div>
</section></div>`);
(async()=>{
await wait(350);document.querySelector('#completionKicker').classList.add('show');
await wait(420);document.querySelector('#completionTitle').classList.add('show');
await wait(520);await typeInto(document.querySelector('#typingLine1'),'Halo Peserta, seluruh rangkaian tes recruitment telah selesai.',27);
await wait(170);await typeInto(document.querySelector('#typingLine2'),'Jawaban Anda telah berhasil diterima dan tersimpan.',27);
await wait(170);await typeInto(document.querySelector('#typingLine3'),'Tim HR akan melakukan proses evaluasi dan menghubungi Anda sesuai tahapan selanjutnya.',23);
await wait(240);await typeInto(document.querySelector('#completionFooter'),'Sampai jumpa di kesempatan berikutnya.',28);
await wait(750);document.querySelector('#completionLogo').classList.add('show');
})();
</script>
</body>
</html>
